version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: squadra_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/squadra_dev?schema=public
    volumes:
      - ./:/squadra-web-back
      - /squadra-web-back/node_modules
      
    depends_on:
      - db
    command: sh -c "npm install && npx prisma generate && npm run dev"

volumes:
  postgres_data: